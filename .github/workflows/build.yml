name: build
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: |
          REM замените на реальную команду сборки из README
          nmake -f makefile
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            **/*.dll
