name: build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: 7zip-plugins
          path: |
            **/*.dll
